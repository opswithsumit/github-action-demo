name: python-lint-ci
on: 
  push:
    paths:
      - '**.py'
  
    
jobs:
  lintjob:
    runs-on: ubuntu-latest
    steps:
      - name: clone code 
        uses: actions/checkout@v6
        
      - name: install lint 
        run: pip install ruff

      - name: verify python code using linter
        run: ruff check .
